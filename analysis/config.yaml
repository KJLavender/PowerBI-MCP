# 分析設定：業務知識（要看哪些維度、怎麼往下鑽）與門檻。
# 欄位必須存在於 Power BI 模型，且能從 fact 沿著「多對一」關聯走到（啟動時會驗證）。

description: 零售銷售 Power BI 報表（資料來自 Oracle，每日更新）

fact: FACT_SALES
date: DIM_DATE.FULL_DATE
holiday: DIM_DATE.HOLIDAY_NAME     # 用來標註節日造成的變化

dimensions:                         # key 用於程式內部；label 用於報告
  region:   {label: 區域,     column: DIM_STORE.REGION_NAME}
  store:    {label: 門市,     column: DIM_STORE.STORE_NAME,     parent: region}
  channel:  {label: 通路,     column: DIM_CHANNEL.CHANNEL_NAME}
  category: {label: 品類,     column: DIM_PRODUCT.CATEGORY}
  product:  {label: 商品,     column: DIM_PRODUCT.PRODUCT_NAME, parent: category}
  segment:  {label: 顧客分群, column: DIM_CUSTOMER.SEGMENT}

# 資料品質：ETL 批次紀錄（與 fact 實際筆數比對）、以哪個維度檢查「某單位資料突然變少」
data_quality:
  etl_table: ETL_BATCH_LOG
  etl_date_key: BUSINESS_DATE_KEY
  etl_rows: ROWS_LOADED
  etl_status: STATUS
  unit: store

# 交叉組合掃描：找出像「北區 × 3C配件」這種只有在組合裡才明顯的變化
combinations:
  - [region, category]
  - [region, channel]
  - [channel, category]
  - [segment, channel]
  - [segment, category]

# 量值之外的比較基準
windows:
  day:   {days: 1,  label: 單日}
  week:  {days: 7,  label: 近 7 日}
  month: {days: 28, label: 近 28 日}
  # 慢性變化：與去年同期相比，並扣除整體的成長（成員相對整體的消長），抓「每週只掉一點」的流失
  # like_for_like：整體基準只計算兩期都有營業的門市（同店比較），新店不會讓舊門市看起來衰退
  year:  {days: 28, label: 近 28 日 vs 去年同期, mode: yoy, like_for_like: store,
          help: 近 28 日 vs 去年同期（相對整體同店成長）}

# 有特定業務意義的量值（量、價、折扣、毛利），供「量價判讀」與評分使用
roles:
  sales: 銷售額
  volume: 銷售數量
  orders: 訂單數
  unit_price: 平均成交單價    # 同品項售價指數（排除商品組合影響）用這個量值
  discount_rate: 折扣率
  margin_rate: 毛利率
  extra: [成本, 毛利, 折扣金額]
price_item: product

# 給問答助理的提示（範例與時間窗用法）
agent:
  examples: >-
    例如「VIP 顧客的訂單數」→ metric="訂單數"、filters={"顧客分群": "VIP"}；「北區 3C配件」→ filters={"區域": "北區", "品類": "3C配件"}。
  window_rules: |-
    - 問「某一天」（例如 9/17、昨天）用 window="day"；「昨天 / 最近一天」= {latest}。
    - 「這週 / 最近一週」用 window="week"；「這個月 / 最近幾週」用 window="month"；「跟去年比 / 長期流失」用 window="year"。
  ask_hint: "**日期**（例如 2026-09-17，或整個月 2026-06）、**指標**（銷售額、毛利率、訂單數…）與**範圍**（區域、門市、品類…）"
  sample_questions:
    - 最近一天的報告有什麼需要注意的？
    - 為什麼 2026-09-17 北區的銷售額下降？
    - 截至 2026-08-03 的近 28 日，生鮮食品的毛利率為什麼下降？
    - 2026-10-03 高雄左營店的業績為什麼大跌？
    - 以 2026-08-23 為準，VIP 顧客的訂單數跟去年同期比，是不是在流失？
    - 客單價是怎麼計算的？資料從哪裡來？

thresholds:
  history_days: 182          # 用來估計「正常波動」的歷史長度
  z_alert: 3.0               # 整體指標：變化量超過歷史波動幾個標準差才算顯著
  z_alert_member: 4.0        # 維度成員：檢定次數多（數百個成員 × 指標 × 時間窗），門檻較高以控制誤報
  min_change_pct: 0.05       # 且變動幅度至少 5%（避免大量體的小波動）
  min_share: 0.01            # 成員佔整體比重太小（<1%）不單獨報告
  min_ratio_change: 0.01     # 比率指標（毛利率、折扣率）至少變動 1 個百分點
  dq_store_ratio: 0.5        # 門市當日訂單數低於同星期中位數的 50% → 資料品質警示
  max_findings: 8
  repeat_days: 14            # 同一變化在幾天內已報告過 → 列為「持續中」而非新發現
